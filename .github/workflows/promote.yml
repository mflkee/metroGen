name: Promote metroGen (staging -> prod)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Образ для прода (staging = текущий стейдж, sha-<hash> = откат)'
        required: false
        default: 'staging'

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: [self-hosted, mkair-runner]
    environment: production
    steps:
      - name: Pull repo code
        run: |
          mkdir -p ~/apps ~/.backups
          cd ~/apps/metroGen || git clone git@github.com:mflkee/metroGen.git ~/apps/metroGen
          cd ~/apps/metroGen
          if [ -f .env ]; then cp .env ~/.backups/metrogen_env_prod_$(date +%Y%m%d_%H%M%S).bak; fi
          git fetch origin && git reset --hard origin/main
          if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || true; fi
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backup DB
        run: |
          mkdir -p ~/.backups
          cd ~/apps/metroGen
          docker compose exec -T db pg_dump -U metrologenerator metrologenerator > ~/.backups/metroGen_db_promote_$(date +%Y%m%d_%H%M%S).sql
      - name: Promote (same image, tag=${{ inputs.tag }})
        run: |
          cd ~/apps/metroGen
          IMAGE_TAG=${{ inputs.tag }} docker compose pull
          IMAGE_TAG=${{ inputs.tag }} docker compose up -d
      - name: Prod health
        run: |
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:8001/docs >/dev/null 2>&1 && { echo PROD_OK; exit 0; }
            sleep 2
          done
          echo PROD_FAIL; exit 1