name: CI metroGen — build GHCR & deploy
on:
  push:
    branches: [main, stage, release/*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.tag.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute tags
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "env=latest" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: |
          docker buildx create --name ghcr-${{ github.run_id }} --driver docker-container --use 2>/dev/null || true
      - name: Build & push api
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          builder: ghcr-${{ github.run_id }}
          tags: |
            ghcr.io/mflkee/metrogen-api:sha-${{ steps.tag.outputs.sha }}
            ghcr.io/mflkee/metrogen-api:${{ steps.tag.outputs.env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          builder: ghcr-${{ github.run_id }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_API_PROXY_TARGET=http://api:8000
          tags: |
            ghcr.io/mflkee/metrogen-frontend:sha-${{ steps.tag.outputs.sha }}
            ghcr.io/mflkee/metrogen-frontend:${{ steps.tag.outputs.env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage'
    needs: build-images
    runs-on: [self-hosted, mkair-runner]
    environment: staging
    steps:
      - name: Pull repo code
        run: |
          mkdir -p ~/apps ~/.backups
          cd ~/apps/metroGen || git clone git@github.com:mflkee/metroGen.git ~/apps/metroGen
          cd ~/apps/metroGen
          if [ -f .env ]; then cp .env ~/.backups/metrogen_env_stg_$(date +%Y%m%d_%H%M%S).bak; fi
          git fetch origin && git reset --hard origin/${{ github.ref_name }}
          if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || true; fi
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy staging (pull images)
        run: |
          cd ~/apps/metroGen
          IMAGE_TAG=staging docker compose -f docker-compose.staging.yml pull
          IMAGE_TAG=staging docker compose -f docker-compose.staging.yml up -d
      - name: Staging health
        run: |
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:9001/docs >/dev/null 2>&1 && { echo STAGING_OK; exit 0; }
            sleep 2
          done
          echo STAGING_FAIL; exit 1

  deploy-prod:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: build-images
    runs-on: [self-hosted, mkair-runner]
    environment: production
    steps:
      - name: Pull repo code
        run: |
          mkdir -p ~/apps ~/.backups
          cd ~/apps/metroGen || git clone git@github.com:mflkee/metroGen.git ~/apps/metroGen
          cd ~/apps/metroGen
          if [ -f .env ]; then cp .env ~/.backups/metrogen_env_prod_$(date +%Y%m%d_%H%M%S).bak; fi
          git fetch origin && git reset --hard origin/${{ github.ref_name }}
          if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || true; fi
      - name: Backup DB
        run: |
          mkdir -p ~/.backups
          cd ~/apps/metroGen
          docker compose exec -T db pg_dump -U metrologenerator metrologenerator > ~/.backups/metroGen_db_$(date +%Y%m%d_%H%M%S).sql
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy prod (pull images)
        run: |
          cd ~/apps/metroGen
          IMAGE_TAG=latest docker compose pull
          IMAGE_TAG=latest docker compose up -d
      - name: Prod health
        run: |
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:8001/docs >/dev/null 2>&1 && { echo PROD_OK; exit 0; }
            sleep 2
          done
          echo PROD_FAIL; exit 1# runner relabel cleanup
